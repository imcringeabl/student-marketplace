{% extends "base.html" %}
{% from "_ui.html" import icon, card with context %}
{% block content %}
<h2 style="margin-bottom:14px">My listings</h2>
<div class="grid">
  {% for l in listings %}<div>{{ card(l, with_heart=False) }}
    <div class="actions" style="margin-top:8px;display:flex;gap:8px">
      <a class="btn" href="{{ url_for('edit_listing', listing_id=l.listing_id) }}">Edit</a>
      <form method="post" action="{{ url_for('delete_listing', listing_id=l.listing_id) }}" onsubmit="return confirm('Delete this listing permanently?')">{{ csrf_field() }}<button class="btn danger">Delete</button></form>
    </div></div>
  {% else %}<p>You have no listings yet. <a href="{{ url_for('new_listing') }}">Sell something</a>.</p>{% endfor %}
</div>
{% endblock %}
